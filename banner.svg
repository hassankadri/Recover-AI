<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1E"/>
      <stop offset="100%" stop-color="#111A2E"/>
    </linearGradient>
    <linearGradient id="lineFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="15%" stop-color="#2DD4BF" stop-opacity="0.55"/>
      <stop offset="85%" stop-color="#2DD4BF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- decision-path motif: signal -> node -> node -> recovered (confined to upper-right, clear of text) -->
  <path d="M 560 178 L 650 178 L 710 118 L 800 118 L 850 68 L 1000 68 L 1050 118 L 1160 118"
        fill="none" stroke="url(#lineFade)" stroke-width="2"/>

  <circle cx="650" cy="178" r="4" fill="#4B5A76"/>
  <circle cx="710" cy="118" r="4" fill="#4B5A76"/>
  <circle cx="800" cy="118" r="5" fill="#F5A623"/>
  <circle cx="850" cy="68" r="4" fill="#4B5A76"/>
  <circle cx="1000" cy="68" r="4" fill="#4B5A76"/>
  <circle cx="1050" cy="118" r="4" fill="#2DD4BF"/>

  <!-- node labels -->
  <text x="800" y="106" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#F5A623" text-anchor="middle">guardrail</text>
  <text x="1050" y="106" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#2DD4BF" text-anchor="middle">recovered</text>

  <!-- wordmark -->
  <text x="60" y="118" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="54" font-weight="700" fill="#EDF1F7">Recover<tspan fill="#2DD4BF">AI</tspan></text>

  <!-- tagline -->
  <text x="62" y="150" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" fill="#9AA7BD">The agent that turns failed payments into recovered revenue</text>

  <!-- signature flow line, monospace -->
  <text x="62" y="188" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#5EEAD4">payment failed <tspan fill="#6B7A98">-&gt;</tspan> why <tspan fill="#6B7A98">-&gt;</tspan> safest response <tspan fill="#6B7A98">-&gt;</tspan> recovered</text>

  <text x="62" y="222" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5C6883">Built for the Razorpay AI Buildathon — Track: AI Revenue Recovery</text>
</svg>
